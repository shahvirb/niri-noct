## Keep Spotify on PipeWire's current default audio sink instead of the
## output it last used. WirePlumber saves Spotify's target under
## application.name "Spotify", which is how this rule matches it.
stream.rules = [
  {
    matches = [
      { application.name = "Spotify" }
    ]
    actions = {
      update-props = {
        state.restore-target = false
      }
    }
  }
]
