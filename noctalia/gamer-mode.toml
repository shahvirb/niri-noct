# Gamer Mode plugin and its compact bar toggle.
[plugins]
enabled = [ "nomadcxx/gamer-mode", "noctalia/world_clock", "niri-noct/world-clock-desktop" ]

[bar.default]
start = [
    "launcher",
    "wallpaper",
    "workspaces",
    "media",
    "taskbar",
]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "disk_used",
    "disk_free",
    "control-center",
    "nomadcxx/gamer-mode:gamermode",
    "noctalia/world_clock:bar",
    "session",
]
