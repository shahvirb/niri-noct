[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[[plugins.source]]
name = "niri-noct-local"
kind = "path"
location = "/home/shahvirb/gitsource/niri-noct/plugins"
enabled = true

[location]
auto_locate = false
address = "78751, Austin, TX"

[weather]
enabled = true
refresh_minutes = 30
unit = "imperial"

[system.monitor]
enabled = true

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = [
    "clock_dp1",
    "weather_dp1",
    "calendar_dp1",
    "world_clock_dp1",
    "cpu_dp1",
    "cpu_temp_dp1",
    "gpu_dp1",
    "gpu_temp_dp1",
    "network_dp1",
]

[desktop_widgets.widget.clock_dp1]
type = "clock"
enabled = false
output = "DP-1"
cx = 1300.0
cy = 1580.0

[desktop_widgets.widget.clock_dp1.settings]
format = "{:%I:%M %p}"
color = "primary"
shadow = true
background = false

[desktop_widgets.widget.weather_dp1]
type = "weather"
output = "DP-1"
cx = 600.0
cy = 1580.0

[desktop_widgets.widget.weather_dp1.settings]
color = "on_surface"
shadow = true
show_forecast = false
background = false

[desktop_widgets.widget.calendar_dp1]
type = "calendar"
output = "DP-1"
cx = 240.0
cy = 850.0

[desktop_widgets.widget.calendar_dp1.settings]
show_events = true
show_week_numbers = false
background = false

[desktop_widgets.widget.cpu_dp1]
type = "sysmon"
output = "DP-1"
box_width = 220.0
box_height = 100.0
cx = 1900.0
cy = 1580.0

[desktop_widgets.widget.cpu_dp1.settings]
display = "graph"
stat = "cpu_usage"
color = "primary"
show_label = true
shadow = true
background = false

[desktop_widgets.widget.cpu_temp_dp1]
type = "sysmon"
output = "DP-1"
cx = 2300.0
cy = 1580.0

[desktop_widgets.widget.cpu_temp_dp1.settings]
display = "gauge"
stat = "cpu_temp"
color = "secondary"
show_label = true
shadow = true
background = false

[desktop_widgets.widget.world_clock_dp1]
type = "niri-noct/world-clock-desktop:world_clock"
output = "DP-1"
cx = 3760.0
cy = 1250.0

[desktop_widgets.widget.world_clock_dp1.settings]
background = false

[desktop_widgets.widget.gpu_dp1]
type = "sysmon"
output = "DP-1"
box_width = 220.0
box_height = 100.0
cx = 2700.0
cy = 1580.0

[desktop_widgets.widget.gpu_dp1.settings]
display = "graph"
stat = "gpu_usage"
color = "primary"
show_label = true
shadow = true
background = false

[desktop_widgets.widget.gpu_temp_dp1]
type = "sysmon"
output = "DP-1"
cx = 3100.0
cy = 1580.0

[desktop_widgets.widget.gpu_temp_dp1.settings]
display = "gauge"
stat = "gpu_temp"
color = "secondary"
show_label = true
shadow = true
background = false

[desktop_widgets.widget.network_dp1]
type = "sysmon"
output = "DP-1"
cx = 3550.0
cy = 1580.0

[desktop_widgets.widget.network_dp1.settings]
display = "graph"
stat = "net_rx"
stat2 = "net_tx"
color = "primary"
color2 = "secondary"
show_label = true
shadow = true
background = false

[widget.taskbar]
group_by_workspace = false
show_all_outputs = false
only_active_workspace = false
show_window_title = true
window_title_max_width = 200

[widget.disk_used]
type = "sysmon"
stat = "disk_used"
path = "/"
visualization = "none"
custom_label = "Disk used"

[widget.disk_free]
type = "sysmon"
stat = "disk_free"
path = "/"
visualization = "none"
custom_label = "Disk free"

[widget.workspaces]
label_source = "name"
max_label_chars = 12
show_labels = true
