[plugins]
enabled = [ "notfinaldev/youtube-search", "davemhammer/tailscale", "nomadcxx/gamer-mode" ]

[shell]
clipboard_confirm_clear_history = true
clipboard_enabled = true
font_family = "Hack Nerd Font"
lang = "en"
telemetry_enabled = true

    [shell.screenshot]
    copy_to_clipboard = true
    freeze_screen = true
    save_to_file = false

[storage]
key_source = "secret-service"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/john/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/john/Pictures/Wallpapers/wallhaven_n6l7x6.jpg"

    [wallpaper.last]
    path = "/home/john/Pictures/Wallpapers/wallhaven_n6l7x6.jpg"

[widget.battery]
display_mode = "graphic"
hide_when_plugged = false
label_content = "rate"

[widget.clock]
format = "{:%I:%M %p %a, %b %e}"

[widget.network]
show_label = false

[widget.sysmon]
stat = "net_rx"
visualization = "graph"

[widget.volume]
show_label = false
