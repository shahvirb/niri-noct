[bar.default]
auto_hide = false
center = [ "clock" ]
enabled = true
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "davemhammer/tailscale:status",
    "bluetooth",
    "volume",
    "sysmon",
    "nomadcxx/gamer-mode:gamermode",
    "session"
]
position = "top"
start = [ "workspaces", "battery" ]

[dock]
pinned = [ "code" ]
position = "left"

[hot_corners]
enabled = false

[lockscreen]
wallpaper = "/nix/store/j2kiw2vhmzw5hwmix70082xcij5kqacf-catppuccin-mocha-2024-02-15/share/wallpapers/catppuccin-mocha/contents/images/3840x2160.png"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-5", "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1" ]

